name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-package-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm-package-guard
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: npm-package-guard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
